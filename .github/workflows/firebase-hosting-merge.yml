name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - master

permissions:
  checks: write
  contents: read
  deployments: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      # ✅ Get dependencies
      - name: Install dependencies
        run: flutter pub get

      # ✅ Build web
      - name: Build web
        run: flutter build web --web-renderer auto

      # ✅ Deploy live
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIOZY_APP }}
          channelId: live
          projectId: triozy-app